<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VenturePulse — Startup News & Intelligence Platform</title>
    <meta name="description" content="Real-time startup news, funding intelligence, government schemes, investor tracking, and startup events verified from primary external sources with zero hallucinations." />
    <meta property="og:title" content="VenturePulse — Startup News & Intelligence Platform" />
    <meta property="og:description" content="Real-time startup news, funding intelligence, government schemes, investor tracking, and startup events verified from primary external sources with zero hallucinations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Prevent theme flash before first paint -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('vp_theme_mode');
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'light') {
            isDark = false;
          } else {
            var legacy = localStorage.getItem('vp_theme');
            if (legacy) {
              isDark = legacy === 'dark';
            } else {
              isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#070B14';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.backgroundColor = '#F2F5F9';
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet" />
  </head>

  </body>
</html>
